name: Deploy engram-chars to GitHub Pages

# The live site is served from the `gh-pages` branch (Settings → Pages →
# "Deploy from a branch"). The real source is `engram-chars/docs`. This workflow
# publishes that directory to gh-pages automatically, replacing the old manual
# `git subtree split` + force-push dance.
on:
  push:
    branches: [main, engram-chars-3d]   # engram-chars-3d is the current working branch; main is prod after merge
    paths:
      - "engram-chars/docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write   # peaceiris pushes to the gh-pages branch via GITHUB_TOKEN

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish engram-chars/docs to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./engram-chars/docs
          publish_branch: gh-pages
          # peaceiris adds .nojekyll automatically (Jekyll stays disabled).
